name: VYRA desktop build

on:
  pull_request:
    branches: [feat/vyra-desktop-foundation]
  push:
    branches: [fix/vyra-media-preview]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build renderer
        run: npm run build
